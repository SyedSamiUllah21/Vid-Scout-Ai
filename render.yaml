services:
  - type: web
    name: Vid-Scout-Ai
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 300 --keep-alive 5
    envVars:
      - key: FLASK_ENV
        value: production
    autoDeploy: true
